name: UCNL Automated Notifications Worker

on:
  schedule:
    # 14:00 UTC = 08:00 AM Hora Monterrey / Centro de México (UTC-6)
    - cron: '0 14 * * *'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub o CLI

jobs:
  check-and-notify:
    name: Check Due Activities & Dispatch FCM Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Notification Worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-due-notifications.js
