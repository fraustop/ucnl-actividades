name: UCNL Automated Notifications Worker

on:
  schedule:
    # Se ejecuta cada hora al minuto 0 para verificar la hora configurada en Firestore (por defecto 08:00 AM Monterrey)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual bajo demanda desde GitHub o CLI
    inputs:
      force:
        description: 'Forzar envío omitiendo comprobación de hora y fecha'
        required: false
        default: false
        type: boolean

jobs:
  check-and-notify:
    name: Check Due Activities & Dispatch FCM Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Notification Worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-due-notifications.js
